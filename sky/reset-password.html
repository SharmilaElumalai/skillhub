<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – Sky Foundation</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        .reset-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .reset-card {
            max-width: 440px;
            width: 100%;
            background: var(--qf-white);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 20px var(--qf-shadow);
        }
    </style>
</head>
<body>
    <div class="reset-wrap">
        <div class="reset-card">
            <h2 style="font-family: 'Playfair Display', serif; margin-bottom: 8px;">Set a new password</h2>
            <p id="statusMsg" style="color: var(--qf-text-light); font-size: 14px; margin-bottom: 20px; line-height: 1.5;"></p>
            <form id="resetForm" style="display: none;">
                <div class="form-group">
                    <label>New password <span class="required">*</span></label>
                    <div class="input-wrap">
                        <input type="password" id="newPassword" minlength="8" required placeholder="At least 8 characters" autocomplete="new-password">
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm password <span class="required">*</span></label>
                    <div class="input-wrap">
                        <input type="password" id="confirmPassword" minlength="8" required placeholder="Re-enter password" autocomplete="new-password">
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Update password</button>
            </form>
            <p id="backLink" style="margin-top: 20px; font-size: 14px; display: none;">
                <a href="admin.html" style="color: var(--qf-green); font-weight: 600;">Back to Admin Portal</a>
            </p>
        </div>
    </div>
    <script>
        const API_BASE = "http://127.0.0.1:5000";
        const API_ROOT = API_BASE + "/api";
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        async function init() {
            const statusEl = document.getElementById("statusMsg");
            if (!token) {
                statusEl.textContent = "This reset link is missing a token. Please use the link from the server log or request a new reset.";
                return;
            }
            try {
                const r = await fetch(
                    API_ROOT + "/reset-status?token=" + encodeURIComponent(token),
                    { credentials: "include" }
                );
                const j = await r.json().catch(() => ({}));
                if (!r.ok || j.status === "error") {
                    statusEl.textContent = j.message || "Could not verify this link.";
                    return;
                }
                const d = j.data || {};
                if (!d.valid) {
                    if (d.error === "expired") {
                        statusEl.textContent =
                            "This reset link has expired. Please go back to the admin portal and request a new password reset.";
                    } else {
                        statusEl.textContent = "This reset link is invalid or has already been used.";
                    }
                    return;
                }
                statusEl.textContent = "Enter a new password (minimum 8 characters).";
                document.getElementById("resetForm").style.display = "block";
            } catch {
                statusEl.textContent = "Could not verify this link. Check that the API server is running.";
            }
        }

        document.getElementById("resetForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            const pw = document.getElementById("newPassword").value;
            const cf = document.getElementById("confirmPassword").value;
            const statusEl = document.getElementById("statusMsg");
            if (pw.length < 8) {
                statusEl.textContent = "Password must be at least 8 characters.";
                return;
            }
            if (pw !== cf) {
                statusEl.textContent = "Passwords do not match.";
                return;
            }
            try {
                const r = await fetch(API_ROOT + "/reset-password", {
                    method: "POST",
                    credentials: "include",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, password: pw }),
                });
                const j = await r.json().catch(() => ({}));
                if (!r.ok || j.status === "error") {
                    statusEl.textContent = j.message || "Could not reset password.";
                    return;
                }
                const d = j.data || {};
                document.getElementById("resetForm").style.display = "none";
                statusEl.textContent = d.message || "Your password has been updated.";
                document.getElementById("backLink").style.display = "block";
            } catch {
                statusEl.textContent = "Network error. Try again.";
            }
        });

        init();
    </script>
</body>
</html>
